# VPN sandboxes. Each line is one sandbox: one VPN container with an HTTP proxy and a SOCKS5 proxy.
# Columns are separated by "|".
#   name       : the name that you give to the scripts, for example: ./start-vpn.sh germany
#                Use lowercase letters, digits and "-" only. The name is also used for the container
#                (vpn-sandbox-<name>) and the browser profiles (~/.vpn-sandbox/profiles/<name>-<browser>).
#   provider   : the Gluetun VPN provider name, for example: expressvpn, nordvpn, mullvad, protonvpn, surfshark.
#                The credentials of the provider are in the file .env.<provider> (copy .env.<provider>.example).
#   country    : the Gluetun country name of the provider (see README for the list command)
#   http_port  : the HTTP proxy port on this Mac. Each sandbox needs a different port.
#   socks_port : the SOCKS5 proxy port on this Mac. Each sandbox needs a different port.
#   timezone   : the time zone of the container
#   browser    : the default browser of open-browser.sh: chrome, brave, edge, chromium, vivaldi or firefox
#
# name       | provider   | country     | http_port | socks_port | timezone         | browser
poland       | expressvpn | Poland      | 8888      | 1080       | Europe/Warsaw    | chrome
germany      | expressvpn | Germany     | 8889      | 1081       | Europe/Berlin    | chrome
netherlands  | expressvpn | Netherlands | 8890      | 1082       | Europe/Amsterdam | chrome
belarus      | expressvpn | Belarus     | 8891      | 1083       | Europe/Minsk      | chrome
croatia      | expressvpn | Croatia     | 8892      | 1084       | Europe/Zagreb     | chrome
denmark      | expressvpn | Denmark     | 8893      | 1085       | Europe/Copenhagen | chrome
estonia      | expressvpn | Estonia     | 8894      | 1086       | Europe/Tallinn    | chrome
